name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # 24.04, not ubuntu-latest: GitHub moved "latest" to 26.04, which Playwright 1.56 cannot install Chrome on
    # (CI failed 2026-11-20). Move to latest again once Playwright supports it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ai-server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Firestore rules, checked against the Firebase Emulator (needs Java 21)
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm run test:rules
      # Click-through tests in a phone-sized Chrome (tests/e2e)
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # The AI server has its own packages and type check
      - run: npm ci
        working-directory: ai-server
      - run: npx tsc --noEmit
        working-directory: ai-server
