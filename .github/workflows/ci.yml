name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ai-server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Firestore rules, checked against the Firebase Emulator (needs Java 21)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm run test:rules
      # Click-through tests in a phone-sized Chrome (tests/e2e)
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # The AI server has its own packages and type check
      - run: npm ci
        working-directory: ai-server
      - run: npx tsc --noEmit
        working-directory: ai-server
