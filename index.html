<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Xpences: AI-powered expense tracker with chat, voice, receipt scanning and bKash/Nagad SMS import." />
    <meta name="theme-color" content="#F97C45" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Xpences" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- ?v= changes with the logo, so browsers drop the tab icon they saved before -->
    <link rel="icon" type="image/png" href="/icon-192.png?v=wallet" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=wallet" />
    <title>Xpences | AI Expense Tracker</title>
  </head>
  <body>
    <!-- The opening screen, drawn by the page itself before any app code loads, so there is never an empty
         screen between the phone's start screen and the opening animation. React replaces it with the
         animation (src/app/OpeningAnimation.tsx), which starts in exactly this spot. -->
    <div id="root"><!--boot-screen--></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
