name = "xpensex-ai"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
FIREBASE_PROJECT_ID = "xpensex-abid"
# What each user may do per day. All of these reset at midnight Bangladesh time.
# Voice messages and files also use one of the AI requests; live chats do not.
DAILY_LIMIT = "30"
DAILY_VOICE_LIMIT = "5"
DAILY_FILE_LIMIT = "3"
DAILY_LIVE_LIMIT = "3"
# How often one person may call this server at all (every route, chosen 2026-11-20). They stop a script from
# using up the free daily database reads. Receipt photos skip the minute limit but count for the day.
REQUESTS_PER_MINUTE = "60"
REQUESTS_PER_DAY = "2000"
# The admin panel turns red when more new items than this were added across the app in one hour
# (src/activity.ts, chosen 2026-11-20). It counts new items only, not edits.
ACTIVITY_ALERT_PER_HOUR = "1000"
# The welcome email a brand-new account gets (src/welcomeEmail.ts, docs/welcome-email-setup.md). Four secrets,
# set with `npx wrangler secret put NAME`: GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET, GMAIL_REFRESH_TOKEN and
# MAIL_FROM_ADDRESS (the admin Gmail they belong to). Until all four are set, no email is sent.
# Longest live chat in seconds. If you change this, also change MAX_LIVE_SECONDS in src/features/chat/limits.ts.
LIVE_SECONDS = "60"
LIVE_MODEL = "gemini-3.8-live"
# Text questions are asked in this order: Groq, Gemini, Cloudflare, OpenRouter (src/providers.ts).
# A service is skipped while its key is missing. The keys are secrets: GROQ_API_KEY and OPENROUTER_API_KEY
# go in .dev.vars and in Cloudflare (npx wrangler secret put GROQ_API_KEY). Separate several models with commas.
# Groq counts its daily limit per model, so each model listed is its own free allowance.
GROQ_MODELS = "openai/gpt-oss-120b,openai/gpt-oss-20b"
# Cloudflare's own AI needs no key, only the [ai] binding below. Free: 10,000 "neurons" a day.
CLOUDFLARE_AI_MODEL = "@cf/openai/gpt-oss-20b"
# Mistral and SambaNova are not used: in 2026 neither has free API use any more (both need payment).
# NVIDIA NIM is not used: NVIDIA's free endpoints are for development and testing only, not apps with real users.
# Free OpenRouter models end in ":free" and change often; pick current ones at https://openrouter.ai/models
# (filter by price: free). Empty means OpenRouter is not used.
OPENROUTER_MODELS = "nvidia/nemotron-3.5-super-vl:free,particle-ai/particle-1:free,baidu/ernie-5.5-flash-preview:free"
# Addresses allowed to call this server. The first one is the fallback.
# https://localhost is the installed phone app (Capacitor). localhost:3000 is development on this computer.
# The website is deliberately not listed: Xpences is used only as the installed app.
ALLOWED_ORIGINS = "https://localhost,http://localhost:3000,http://localhost:5173"
# User IDs (Firebase Console > Authentication > Users > User UID) that may use the admin panel.
# Separate several with commas. The admin key itself is the FIREBASE_SERVICE_ACCOUNT secret.
ADMIN_UIDS = "vNQuoT4KGBTItv1tLZkAO255xuv1"
# "true": a brand new account's first device also waits for the admin (used during testing).
# "false": a brand-new account's very first device comes in straight away (chosen 2026-11-11). Extra devices,
# and any device on an account that ever had one, always need approval (mayAutoApprove in src/deviceRules.ts).
REQUIRE_FIRST_DEVICE_APPROVAL = "false"
# Linked Google apps (Drive backups, Sheets exports). The client ID is public, so it can sit here
# (the same value as VITE_GOOGLE_CLIENT_ID in the app). Two secrets go in .dev.vars and in Cloudflare:
#   GOOGLE_CLIENT_SECRET  the OAuth client's secret from Google Cloud
#   GOOGLE_TOKEN_KEY      32 random bytes in base64, which lock the saved Google tokens
GOOGLE_CLIENT_ID = "77916812361-rbhs4vgr2p0cdmlu96umf52nd2agnssb.apps.googleusercontent.com"

# Every hour: take loan installments that have come due, and refresh exchange rates once they
# are 10 days old (free on Cloudflare)
[triggers]
crons = ["0 * * * *"]

# Cloudflare's own AI (backup answers and voice transcription). It runs on Cloudflare even during npm run dev.
[ai]
binding = "AI"
# Always on Cloudflare, even in npm run dev. On the free Workers plan this can't cost money:
# past the 10,000 free neurons a day it simply refuses, and the chain moves on.
remote = true

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "UsageLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageLimiter"]

# Receipt photos and PDFs (src/receipts.ts). Make the bucket once with:
#   npx wrangler r2 bucket create xpences-receipts
[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "xpences-receipts"
